name: Verify Hostinger root

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node verify.mjs
      - name: Check root JavaScript syntax
        run: |
          for file in app.js care-showcase.js smile-scene.js; do
            node --check "$file" || exit
          done
      - name: Validate publication ZIP
        run: node prepare-hostinger.mjs "$RUNNER_TEMP/hostinger-packages"
